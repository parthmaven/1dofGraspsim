name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Unit tests
        run: pytest -q
      - name: CLI smoke run
        run: |
          graspsim2d describe
          graspsim2d screen baseline_paddle --out runs/ci/screen
          graspsim2d simulate baseline_paddle --objects mini_1oz,b_flute_3mm --out runs/ci/simulate
          graspsim2d sweep baseline_paddle --vary finger_torque=1:9:5 --out runs/ci/sweep
          graspsim2d search --quick --out runs/ci/search
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-runs
          path: runs/ci
          if-no-files-found: ignore
