# S5 L-cradle crank: batch 1, author FP (subagent bc-ccb7b6dd-a8f0-5a1b-9e45-6a2c8199f732).
# Written from concept-spec-template.yaml revision 2, against test-conditions.md revision 2.
# Frame: graspsim2d finger-local, mm. u along the finger, v inward; the face plane is v = 17.75.
# Geometry and loads: internal/gripper-review/scripts/fp-concept-geometry.py, fp-t4a-lip-spans.py
# (T4a; supersedes fp-t4a-descent.py on hooking), fp-t3-chisel-lean.py (T3) and fp-s4-s5-t5-seat.py
# (T5's seat, stops and G1 loads).
# Nominal numbers in comments are at finger_reach 160 and the new_variables' nominals.
# The lane is reworked (see notes): the steps interleave out of plane, and the 14 deg face is dropped.

id: S5
name: L-cradle crank
author: FP
batch: 1
status: proposed
moving_parts: none
idea: >
  Each finger carries a 38 mm inward step right after the root. At the 45 deg L the
  two step faces lie on the case's bottom and wall lines, bearing 48 - 74 mm along each
  finger, so the case seats in a true L, 11 mm clear of the hub, instead of on the tips at
  about 145 mm. That cuts the T5 moment from 37 - 45 to 17 - 19 N·m per gripper at 23 kg in
  the strength check, low enough for the 45 deg stop or, at the 90 deg reading, the reference
  brake to hold. The steps interleave out of plane like a comb. Each fills
  one half of the paddle's width, and the other finger is relieved in that half, so the
  jaw still closes for boxes and sheets. In-plane steps would collide below 35 deg. Below
  the step, a pad toed in 16 deg (the crank, r1-25's idea) sits square to mid-size boxes at
  their grasp angle. Then come Parth's undercut, a flush shoulder and a toed-in chisel.
  Against S4, both fingers are the same, so the analytic screen can run it.

strategy:
  T1: "The crank pads grip 17 - 29 mm of box face, 80 - 109 mm along the fingers; the steps are the depth stop"
  T2: "The flush shoulders below the undercuts meet at -0.46 deg and pinch the sheet bare"
  T3: "Chisels toed in 15.5 deg, square at the CFS grasp angle, <= 3 mm thick over 18 mm"
  T4: "The lip seats in the undercut on a back-cut far wall: T4b at both readings; T4a only for lips up to about 54 mm across"
  T5: "Both step faces seat the L, bearing 48 - 74 mm along each finger, 11 mm clear of the hub. They are square only at 45 deg per finger. At the 45 deg reading that is the end stop's angle, so the stops hold it, provided the jaw is on them when the case loads it (notes). At the 90 deg reading the jaw sits mid-stroke and the drive's power-off brake holds it"
  durability: "The pads sit out of the T3 and T5 contacts; T5 bears on 26 x 75 mm printed step faces, not on the tips"

fingers:
  symmetric: true
  asymmetric_for: []
  outside:
    root: platform
    outline:
      - [46.0, 17.75]
      - [48.0, 17.75]
      - [48.0, "17.75 + step_height"]                                                   # the step, 38 mm proud, in this finger's half of the width
      - ["48 + step_length", "17.75 + step_height"]                                     # T5 bearing face, u 48 - 74
      - ["48 + step_length", "17.75 - pad_rise - pad_thickness"]                        # square distal face down to the crank pad's seat
      - ["finger_reach - chisel_length - tooth_length - undercut_length - 3", "17.75 - pad_thickness"]   # crank seat, toed in 16 deg, u 74 - 109
      - ["finger_reach - chisel_length - tooth_length - undercut_length - 3", 17.75]
      - ["finger_reach - chisel_length - tooth_length - undercut_length", 17.75]        # undercut near wall, u 112
      - ["finger_reach - chisel_length - tooth_length - undercut_length", "17.75 - undercut_depth"]
      - ["finger_reach - chisel_length - tooth_length + seat_backcut", "17.75 - undercut_depth"]
      - ["finger_reach - chisel_length - tooth_length", 17.75]                          # back-cut far wall, u 132
      - ["finger_reach - chisel_length", 17.75]                                         # flush shoulder, u 132 - 142
      - ["finger_reach - chisel_length", "17.75 - chisel_setback - chisel_rise"]
      - ["finger_reach", "17.75 - chisel_setback"]                                      # toed-in chisel face
      - ["finger_reach", "17.75 - chisel_setback - tip_land"]
      - ["finger_reach - chisel_length", "17.75 - chisel_setback - chisel_rise - 3.0"]
      - ["finger_reach - chisel_length - 6.0", "17.75 - undercut_depth - ligament"]
      - ["finger_reach - chisel_length - tooth_length - undercut_length", "17.75 - undercut_depth - ligament"]
      - [46.0, -21.25]
    body_width_mm:
      - [46, 75]            # one half of the paddle at u 46 - 78: the step's half; the other half is relieved
      - [78, 75]
      - [78, 97]
      - [90, 97]
      - [90, 60]
      - [170, 60]
    pads:
      - name: crank_face
        role: box
        side: inner
        face: [["48 + step_length", "17.75 - pad_rise"], ["finger_reach - chisel_length - tooth_length - undercut_length - 3", 17.75]]
        crown_radius_mm: null
        thickness_mm: "pad_thickness"
        shore_a: "pad_shore"
        width_mm: 60
        material: "PU 50A, smooth, blue and metal-detectable; cast through keying holes in its seat, so it is held mechanically and changes with the finger (G2)"
    features:
      tip:
        thickness_profile_mm:
          - ["finger_reach", "tip_land"]
          - ["finger_reach - 15", "tip_land + (3.0 - tip_land) * 15 / chisel_length"]
          - ["finger_reach - chisel_length", 3.0]
      undercut:
        u_from: "finger_reach - chisel_length - tooth_length - undercut_length"   # 112 at nominal
        u_to: "finger_reach - chisel_length - tooth_length"                       # 132 at nominal
        depth_mm: "undercut_depth"
        root_radius_mm: 3
        side: inner
        purpose: "seats the crate's rim lip (test-conditions.md, T4) on a far wall back-cut by atan(seat_backcut / undercut_depth), 0 - 20 deg"
      hard_stop:
        type: end_of_stroke
        opening_deg: 90
        where: "a printed block on each finger's paddle back, about 60 - 80 mm from its pivot, with a 20 x 30 mm face against SR's 2 mm 304 wear plate on the bracket, at the end of the stroke: 90 deg, or 45 deg under the 45 deg reading, where it also holds the L. Each finger stops on itself, so neither the mesh nor the drive carries T5. At 23 kg the outside block takes 155 - 206 N in the strength check (0.26 - 0.34 MPa) and 103 - 138 N held at rest, and leaves its root 3 - 48 N and at most 1.7 N·m; the thumb's takes 86 - 115 N. Set the 45 deg stop at 45, +1 / -0 (notes)"
  inside: same

search:
  base_concept: new
  existing_variables:
    active: [finger_reach, finger_torque, pad_thickness, pad_shore]
    fixed: {}
    narrow:
      finger_reach: [150, 160]
      finger_torque: [2.0, 8.0]
      pad_thickness: [3, 6]
      pad_shore: [40, 60]
    nominal:
      finger_reach: 160
      finger_torque: 4.0
      pad_thickness: 4
      pad_shore: 50
  new_variables:
    step_height: {range: [36.5, 42], unit: mm, nominal: 38, meaning: "step above the face plane; at 45 deg the corner sits 1.41 (17.75 + step_height) - 19 mm ahead of the pivot line, 59.8 at 38. >= 30.0 keeps it off the hub, 48.5 mm ahead (VAL, from the STEP; 30.6 with clearance); over the range the corner clears the hub by 9 - 17 mm, 11.3 at nominal (fp-s4-s5-t5-seat.py)"}
    step_length: {range: [20, 30], unit: mm, nominal: 26, meaning: "step length along u, the bearing patch; 26 x 75 mm keeps 23 kg under the 105 kPa thumb limit"}
    pad_rise: {range: [4, 14], unit: mm, nominal: 10, meaning: "crank toe-in: the pad face's root end sits this far outboard of its tip end; atan(pad_rise / pad length) = 16 deg at nominal, square to a 61 mm box at its grasp angle"}
    chisel_length: {range: [15, 19], unit: mm, nominal: 18, meaning: "chisel length; with tooth_length the hook under the lip stays <= 30 mm (T4 free wall)"}
    chisel_rise: {range: [2, 7], unit: mm, nominal: 5.0, meaning: "chisel toe-in; atan(chisel_rise / chisel_length) = 15.5 deg at nominal, square at the CFS grasp angle in T3"}
    chisel_setback: {range: [0.5, 2.0], unit: mm, nominal: 1.0, meaning: "chisel tip set back from the face plane, so no T4 or T5 contact lands on it"}
    tip_land: {range: [1.0, 1.5], unit: mm, nominal: 1.5, meaning: "in-plane thickness at the point (batch rule)"}
    tooth_length: {range: [10, 11], unit: mm, nominal: 10, meaning: "flush shoulder between the undercut and the chisel"}
    undercut_length: {range: [18, 22], unit: mm, nominal: 20, meaning: "lip pocket length at the mouth (STEP: u 105 - 125)"}
    undercut_depth: {range: [7, 11], unit: mm, nominal: 8.1, meaning: "pocket depth below the face plane (STEP: 8.1)"}
    seat_backcut: {range: [0, 3], unit: mm, nominal: 2, meaning: "far wall's foot runs this far toward the tip past its mouth; 0 is level-cut"}
    ligament: {range: [11, 16], unit: mm, nominal: 13, meaning: "in-plane depth under the pocket floor (batch rule 10 - 15)"}
  fixed_by_spec:
    - "root and hinge (u <= 46), the platform's: a hardware rule"
    - "steps start at u 48, so each finger's relief stays outside the kept root"
    - "chisel 3.0 mm at its root, bare: the batch rule"
    - "back at (46, -21.25): the platform's 39 mm root depth; the section under the crank seat stays >= 17 mm at nominal"
    - "step_height >= 36.5 keeps the corner at least 9 mm off the hub; below 30.0 the hub, not the steps, holds the corner, and the cradle is lost"
    - "45 deg stop at 45 deg, +1 / -0, under the 45 deg reading: the cradle seats square only at 45 deg, so the stops hold T5 (17 - 19 N·m per gripper at 23 kg in the strength check) off the drive"
    - "T5 holder at the 90 deg reading: the drive's power-off brake, the reference 30 N·m per gripper"
    - "hinge: the next phase's metal hinge (SR's hardware list): Ø15 h6 stainless shafts (17-4PH H1025 or 440C), keyed; four sealed 6002-2RS bearings, stainless with H1 grease over open product, in metal sleeves; steel or 7075 clamp hubs in place of the printed mount; a case-hardened module-2 steel gear pair; each finger on two captive M5 x 25 A4-70 socket screws with retaining washers, in pressed Ø9 x Ø5.2 x 12 mm stainless sleeves"
    - "operator fasteners (G2): only each finger's two captive M5 socket screws (ISO 4762), which take the cell's one 4 mm stainless hex key. The pads are cast in, so a pad change is a finger swap; the stops' wear plates are fitted at the bench"

stroke:
  readings: [45, 90]

materials:
  finger: common
  print_orientation: flat

notes: >
  Lane rework. batch-1-plan.md's S5, "a 36 mm inward step or a 14 deg distal face", can't
  be built as drawn. Two in-plane 36 - 38 mm steps make the fingers overlap below 35.3 deg
  per finger (fp-concept-geometry.py section 1), so the jaw can't close on any T1 box or a T2 sheet.
  A 14 deg distal face doesn't move the bearing, because the hub still holds the corner
  48.5 mm ahead (VAL, from the STEP) and only the tips touch. So the steps interleave out of plane, a comb: each
  finger's step fills its half of the paddle width, about 75 mm, with 4 mm between the
  layers, and the other half is relieved at u 46 - 78. MuJoCo's finger geoms don't collide
  with each other, which matches the comb. The 2D outline can't show the relief, and CAD must check it.
  Crank. The toed-in pad is r1-25's cranked-flat idea, moved below the steps. Because the
  steps cap insertion at 57 - 75 mm, the box's top lands at u 80 - 92, and the pad takes
  17 - 29 mm of face. One 16 deg angle sits within ±11 deg of square for 45 - 99 mm boxes.
  Length. finger_reach is 150 - 160 mm, nominal 160. The flagged 170 mm run is worth it for S5.
  It lowers the box 10 mm further under the steps, giving the crank pads 27 - 39 mm of face.
  T5 costs nothing, because the steps, not the tips, carry it. T4a gains almost nothing
  (54 to 57 mm, fp-t4a-lip-spans.py).
  How T5's opening is held. The step faces are square to each other only at 45 deg per
  finger (fp-s4-s5-t5-seat.py). At the 45 deg reading that is the end stop's angle, and the
  case's moment opens each finger onto its own stop, so the stops engage whenever the cradle
  seats. That needs the jaw on its stops when the case loads it: the arm moves in until the
  wall meets the thumb's step, then rises until the outside step lifts the case, with no
  closing step. If the jaw closes onto the case first (test-conditions' T5 approach), it ends
  asin(gap / 73 mm) short, 0.8 - 4 deg for a 1 - 5 mm gap, and the steps bear on their far
  corners. At 1 deg short the servo or brake carries 10 - 12 N·m per gripper at rest, 14.5 -
  18.5 in the 0.25 g hold test and 20.5 - 23 in the strength check, still inside the drive's
  25 N·m peak and the 30 N·m brake. Set the 45 deg stop at 45, +1 / -0: opening past 45 moves
  the contacts toward the corner, and the corner stays 9 - 11 mm off the hub up to 47 deg.
  At the 90 deg reading the jaw holds the L mid-stroke on the drive's power-off brake: 9 - 10
  N·m at rest, 12 - 16 in the 0.25 g hold test and 17 - 19 in the strength check. That is
  inside the reference 30 N·m brake and the drive's 25 N·m peak, but past its 7 - 10 N·m
  continuous rating, so the brake, not the motor, holds a parked case. No l_angle stop, so
  S5 keeps the 90 deg reading.
  MuJoCo has no hub body. Add one before scoring T5, so a corner that misses the steps
  lands on the hub as it would in the real jaw.
  G1. Judged with the next phase's metal hinge (fixed_by_spec), S5 rates 23 kg at both
  readings, if SR's hinge check for S3 - S5 confirms it. At the 45 deg reading the stops hold
  it, as on S4: the blocks bear 0.34 MPa at most, the paddle beyond them carries under 1 N·m,
  the steps bear in compression, and the roots carry at most 48 N and 1.7 N·m, plus each
  step's 8 N·m of torsion, inside the steel clamp hubs. At the 90 deg reading the brake and
  drive hold 17 - 19 N·m in the strength check, so neither the drive's 25 N·m peak nor the
  30 N·m brake sets the rating: they cover about 30 and 36 kg. The hardened gear pair takes
  that moment across the mesh. The case survives the power cut at either reading: on the
  stops at 45 deg, and on the brake at 90 deg (9 - 10 N·m at rest). The 14 mm knuckle is a
  free end and carries nothing (VAL R5.2). As built, VAL puts the printed root at about
  16 kg for S5 if the moment passes through it (R5.2), and SR rates the printed hinge about
  11 - 14 kg on tip-bearing loads.
  G2. The operator touches only each finger's two captive M5 socket screws, on the cell's one
  4 mm stainless hex key. Both crank pads are cast through keying holes in their seats, so
  they can't come off alone, and they change with the fingers. Nothing else comes off.

expected:
  T1: "Passes the light and mid boxes and is panel-limited on the heaviest. The 16 deg crank sits within 11 deg of square, so squeeze-out needs mu >= 0.19 against the pad's 0.5. The pads grip 17 - 29 mm above most fill lines (F1, F2)."
  T2: "Like the platform: the flush shoulders meet at -0.46 deg and pinch bare at mu 0.30 - 0.35. Holds light sheets (F1)."
  T3: "Enters the 3 mm gap. The chisels are toed in 15.5 deg against a 16.0 deg CFS grasp angle, so they lean 0.5 deg and need a 2.55 mm gap; at 1.3 mm they push a neighbour 1.25 mm (F3, fp-t3-chisel-lean.py)."
  T4: "Passes T4b at both readings and fails T4a at both. T4b: the seat takes 110 N, and the drive holds a 1.5 N·m opening moment. T4a: the 8.1 mm pocket takes the lip only up to about 8.5 deg of jaw angle, a 54 mm span (57 at 170). The 212 mm bin needs a pocket about 20 mm deep (fp-t4a-lip-spans.py)."
  T5: "Holds: both step faces seat the L 48 - 74 mm along each finger (resultant about 61 mm), so Q is 17 - 19 N·m per gripper at 23 kg in the strength check, 12 - 16 in the 0.25 g hold test and 9 - 10 at rest (equal to 60/40 share), against 37 - 45 for the tip-bearing concepts. The 45 deg stops hold it at the 45 deg reading and the reference brake at the 90 deg reading; rated 23 kg at both (G1, notes). The flaps take the load 19 - 45 mm from the wall, not 114 mm in. If the approach closes the jaw onto the case, it sits 0.8 - 4 deg short and the steps' far corners carry 20.5 - 23 N·m in the strength check at 1 deg short (fp-s4-s5-t5-seat.py, F5 rework)."

tradeoffs:
  - "Cuts T5's moment about 2.4 times against tip bearing, but the steps cap T1 insertion at 57 - 75 mm"
  - "The comb relief halves each paddle's width at u 46 - 78"
  - "One crank angle covers 45 - 99 mm boxes to ±11 deg"
  - "Brake-held T5 keeps the 90 deg reading: 9 - 10 N·m at rest and 17 - 19 in the strength check at 23 kg, inside the reference brake and the drive's peak; the 45 deg reading holds it on the stops instead"
  - "Symmetric, so the screen runs it, but the two step faces bear in different halves of the width"

risks:
  - "The comb's 4 mm layer gap closes under out-of-plane load and the steps clash"
  - "Each step bears in its own half of the width, so each finger's root sees about 8 N·m of torsion at 23 kg [estimate], which 2D can't check"
  - "A box top edge can catch on a step's square distal face if the descent overshoots"
  - "MuJoCo lets the steps pass through each other and has no hub, so both failure modes this concept is built around go unseen"
  - "Heavier, more complex prints: the steps and reliefs add support material and print time"
