# S4 Asymmetric pair: batch 1, author FP (subagent bc-ccb7b6dd-a8f0-5a1b-9e45-6a2c8199f732).
# Written from concept-spec-template.yaml revision 2, against test-conditions.md revision 2.
# Frame: graspsim2d finger-local, mm. u along the finger, v inward; the face plane is v = 17.75.
# Geometry and loads: internal/gripper-review/scripts/fp-concept-geometry.py, fp-t4a-lip-spans.py
# (T4a; supersedes fp-t4a-descent.py on hooking), fp-t3-chisel-lean.py (T3) and fp-s4-s5-t5-seat.py
# (T5's seat, stops and G1 loads), and fp-t4-tooth-neck.py (T4's tooth neck).
# Nominal numbers in comments are at finger_reach 160 and the new_variables' nominals.
# MuJoCo only (asymmetric).

id: S4
name: Asymmetric pair
author: FP
batch: 1
status: proposed
moving_parts: none
idea: >
  The two fingers do different jobs. The outside finger is a flat floor and a hook: a
  bare face, flat from the root to the shoulder, on which the T5 case bottom lies at the
  45 deg L. It carries Parth's undercut with a back-cut seat, and a toed-in chisel set back
  1 mm, so the chisel never carries T5. The inside finger, the thumb, has a 38 mm step
  right after the root, so at 45 deg its face reaches the case wall: the hub would
  otherwise hold the wall 35 mm off. Below the step it carries the pad for box faces and
  for the T4b crate's inner wall, then the same undercut and chisel. The step is
  interleaved out of plane: it fills one half of the paddle's width, and the outside
  finger is relieved in that half, so the closed jaw doesn't collide. Against S5's two
  steps, S4 keeps the outside finger plain and lets the case lie on it, which moves the
  T5 resultant to about 90 mm from the pivot.

strategy:
  T1: "The box sits between the outside finger's bare face and the thumb's pad, 85 - 103 mm along the fingers; the thumb's step is the depth stop"
  T2: "The flush shoulders below the undercuts meet at -0.46 deg and pinch the sheet bare"
  T3: "Both chisels are toed in 15.5 deg, square at the CFS grasp angle, and <= 3 mm thick over their 18 mm"
  T4: "T4b: the outside finger's undercut seats the lip and the thumb's pad bears on the wall's inner face; in T4a the 8.1 mm pocket takes the lip only up to about 8.5 deg of jaw angle"
  T5: "On its 45 deg stops the case bottom lies flat along the outside finger, and the thumb's step bears on the wall 57 - 83 mm up from the corner, 2.9 mm clear of the hub. The two faces are square only at 45 deg per finger, the stop angle, so the cradle seats on the stops, provided the jaw is on them when the case loads it: the arm rises to seat the case, and the jaw doesn't close onto it (notes)"
  durability: "One pad, on the thumb, out of the T3 and T5 contacts; each finger's stop takes T5 off the 1:1 mesh and the drive"

fingers:
  symmetric: false
  asymmetric_for: [T4, T5]
  outside:
    root: platform
    outline:
      - [46.0, 17.75]                                                                  # bare floor face, flat to the shoulder
      - ["finger_reach - chisel_length - tooth_length - undercut_length", 17.75]        # undercut near wall, u 112
      - ["finger_reach - chisel_length - tooth_length - undercut_length", "17.75 - undercut_depth"]
      - ["finger_reach - chisel_length - tooth_length + seat_backcut", "17.75 - undercut_depth"]   # floor's far end, u 134
      - ["finger_reach - chisel_length - tooth_length", 17.75]                          # back-cut far wall, u 132
      - ["finger_reach - chisel_length", 17.75]                                         # flush shoulder, u 132 - 142
      - ["finger_reach - chisel_length", "17.75 - chisel_setback - chisel_rise"]        # stop face
      - ["finger_reach", "17.75 - chisel_setback"]                                      # toed-in chisel face
      - ["finger_reach", "17.75 - chisel_setback - tip_land"]
      - ["finger_reach - chisel_length", "17.75 - chisel_setback - chisel_rise - 3.0"]  # chisel back, 3.0 mm at its root
      - ["finger_reach - chisel_length - 6.0", "17.75 - undercut_depth - ligament"]
      - ["finger_reach - chisel_length - tooth_length - undercut_length", "17.75 - undercut_depth - ligament"]
      - [46.0, -21.25]
    body_width_mm:
      - [46, 80]            # the paddle's thumb-step layer is relieved at u 46 - 78; this is the remaining layer
      - [78, 80]
      - [78, 97]
      - [90, 97]
      - [90, 60]
      - [170, 60]
    pads: []
    features:
      tip:
        thickness_profile_mm:
          - ["finger_reach", "tip_land"]
          - ["finger_reach - 15", "tip_land + (3.0 - tip_land) * 15 / chisel_length"]
          - ["finger_reach - chisel_length", 3.0]
      undercut:
        u_from: "finger_reach - chisel_length - tooth_length - undercut_length"   # 112 at nominal
        u_to: "finger_reach - chisel_length - tooth_length"                       # 132 at nominal
        depth_mm: "undercut_depth"
        root_radius_mm: 3
        side: inner
        purpose: "seats the crate's rim lip (T4b: the outside finger is the hook) on a far wall back-cut by atan(seat_backcut / undercut_depth), 0 - 14 deg at the 8.1 mm depth (14 deg at nominal)"
      hard_stop:
        type: l_angle
        opening_deg: 45
        where: "a printed block on the back of the paddle, about 60 - 80 mm from the pivot, with a 20 x 30 mm face against the 2 mm 304 wear plate on SR's stop arm (next-phase hardware), with a shim at each stop so both stops touch. Today's bracket has nothing there, so as built the drive holds 45 deg. The block's face sits 2.25 mm outboard of the root's back line (v -25), so it stands 7.5 mm proud of the back at u 60 and 13.0 mm at u 80, in the layer not relieved for the thumb's step (u 46 - 78). It stops the finger itself, so neither the mesh nor the drive carries T5. At 23 kg it takes 225 - 300 N in the strength check (0.37 - 0.50 MPa) and 150 - 200 N held at rest (0.25 - 0.33 MPa, against the 8 MPa creep allowable), and the root carries only 0.8 - 3.5 N·m, against 18 N·m with the stop on the shaft. Set at 45 deg, or up to 1 deg past, never short (notes)"
  inside:
    root: platform
    outline:
      - [46.0, 17.75]
      - [48.0, 17.75]
      - [48.0, "17.75 + step_height"]                                                   # the step: 38 mm proud, in one half of the paddle width
      - ["48 + step_length", "17.75 + step_height"]                                     # wall-bearing face, u 48 - 74
      - ["48 + step_length", 17.75]                                                     # square distal face, 3 mm fillets
      - ["52 + step_length", 17.75]
      - ["52 + step_length", "17.75 - pad_thickness"]                                   # pad seat, u 78 - 109
      - ["finger_reach - chisel_length - tooth_length - undercut_length - 3", "17.75 - pad_thickness"]
      - ["finger_reach - chisel_length - tooth_length - undercut_length - 3", 17.75]
      - ["finger_reach - chisel_length - tooth_length - undercut_length", 17.75]
      - ["finger_reach - chisel_length - tooth_length - undercut_length", "17.75 - undercut_depth"]
      - ["finger_reach - chisel_length - tooth_length + seat_backcut", "17.75 - undercut_depth"]
      - ["finger_reach - chisel_length - tooth_length", 17.75]
      - ["finger_reach - chisel_length", 17.75]
      - ["finger_reach - chisel_length", "17.75 - chisel_setback - chisel_rise"]
      - ["finger_reach", "17.75 - chisel_setback"]
      - ["finger_reach", "17.75 - chisel_setback - tip_land"]
      - ["finger_reach - chisel_length", "17.75 - chisel_setback - chisel_rise - 3.0"]
      - ["finger_reach - chisel_length - 6.0", "17.75 - undercut_depth - ligament"]
      - ["finger_reach - chisel_length - tooth_length - undercut_length", "17.75 - undercut_depth - ligament"]
      - [46.0, -21.25]
    body_width_mm:
      - [46, 155]           # the step itself is about 70 mm wide, in the layer the outside finger leaves free
      - [85, 97]
      - [90, 97]
      - [90, 60]
      - [170, 60]
    pads:
      - name: thumb_face
        role: all             # T1 box face and the T4b crate's inner wall; it doesn't reach the T5 wall
        side: inner
        face: [["52 + step_length", 17.75], ["finger_reach - chisel_length - tooth_length - undercut_length - 3", 17.75]]
        crown_radius_mm: null
        thickness_mm: "pad_thickness"
        shore_a: "pad_shore"
        width_mm: 60
        material: "PU 50A, smooth, blue and metal-detectable; cast through keying holes in its seat, so it is held mechanically and changes with the finger (G2)"
    features:
      tip:
        thickness_profile_mm:
          - ["finger_reach", "tip_land"]
          - ["finger_reach - 15", "tip_land + (3.0 - tip_land) * 15 / chisel_length"]
          - ["finger_reach - chisel_length", 3.0]
      undercut:
        u_from: "finger_reach - chisel_length - tooth_length - undercut_length"
        u_to: "finger_reach - chisel_length - tooth_length"
        depth_mm: "undercut_depth"
        root_radius_mm: 3
        side: inner
        purpose: "T4a's second hook, for lips up to about 54 mm across; in T4b the thumb bears on the inner wall instead"
      hard_stop:
        type: l_angle
        opening_deg: 45
        where: "the same printed block as the outside finger, on the thumb's paddle back, at the same height off the back and in the same layer, so the two arms sit level. It lands on the wear plate of SR's second stop arm, with its own shim; as built, the drive holds 45 deg. It takes 86 - 115 N in the strength check at 23 kg"

search:
  base_concept: new
  existing_variables:
    active: [finger_reach, finger_torque, pad_thickness, pad_shore]
    fixed: {}
    narrow:
      finger_reach: [150, 160]
      finger_torque: [2.0, 8.0]
      pad_thickness: [3, 6]
      pad_shore: [40, 60]
    nominal:
      finger_reach: 160
      finger_torque: 4.0
      pad_thickness: 4
      pad_shore: 50
  new_variables:
    step_height: {range: [36.5, 42], unit: mm, nominal: 38, meaning: "thumb step above the face plane; at 45 deg its face is the case's wall line. >= 35.1 keeps the wall off the hub, 48.5 mm ahead of the pivot line (VAL, from the STEP); over the range it clears the hub by 1.4 - 6.9 mm, 2.9 at nominal (fp-s4-s5-t5-seat.py)"}
    step_length: {range: [20, 30], unit: mm, nominal: 26, meaning: "step length along u, the wall-bearing patch; 26 x 70 mm keeps 23 kg under the 105 kPa thumb limit"}
    chisel_length: {range: [18, 19], unit: mm, nominal: 18, meaning: "chisel length; with tooth_length the hook under the lip stays <= 30 mm (T4 free wall). At least 18 for T3: at 15 the shoulder sits 13.5 mm above the point, inside the 15 mm entry, so the whole tooth must enter the gap (9.9 mm), and below 18 the nominal 5 mm rise toes in past the 160 mm grasp angle (fp-t3-chisel-lean.py --corners)"}
    chisel_rise: {range: [4.5, 5.1], unit: mm, nominal: 5.0, meaning: "chisel toe-in over its length; atan(chisel_rise / chisel_length) = 15.5 deg at nominal, square at the CFS grasp angle in T3. 4.5 - 5.1 keeps every T3 range corner within the 1.3 mm gap plus the neighbour's 1.3 mm of free travel: the worst need 2.58 mm at 4.5 and 2.59 at 5.1, against 2.6. The old 2 - 7 pushed up to 3.35 mm, past T3's 3 mm limit (VAL R8 item 9; fp-t3-chisel-lean.py --corners)"}
    chisel_setback: {range: [0.5, 2.0], unit: mm, nominal: 1.0, meaning: "chisel tip set back from the face plane, so the T5 floor bears on the shoulder, not the chisel"}
    tip_land: {range: [1.0, 1.5], unit: mm, nominal: 1.5, meaning: "in-plane thickness at the point (batch rule)"}
    tooth_length: {range: [10, 11], unit: mm, nominal: 10, meaning: "flush shoulder between the undercut and the chisel"}
    undercut_length: {range: [18, 22], unit: mm, nominal: 20, meaning: "lip pocket length at the mouth (STEP: u 105 - 125)"}
    undercut_depth: {range: [7, 9], unit: mm, nominal: 8.1, meaning: "pocket depth below the face plane (STEP: 8.1); the lip sticks out 6 mm. At most 9: a deeper pocket thins the tooth's neck past T4's 16 MPa (fp-t4-tooth-neck.py)"}
    seat_backcut: {range: [0, 2], unit: mm, nominal: 2, meaning: "far wall's foot runs this far toward the tip past its mouth; 0 is level-cut. At most 2, for the tooth's neck in T4 (fp-t4-tooth-neck.py)"}
    ligament: {range: [11, 16], unit: mm, nominal: 13, meaning: "in-plane depth under the pocket floor (batch rule 10 - 15)"}
  fixed_by_spec:
    - "root and hinge (u <= 46), the platform's: a hardware rule"
    - "step starts at u 48, so the outside finger's relief stays outside the kept root"
    - "chisel 3.0 mm at its root, bare: the batch rule"
    - "back at (46, -21.25): the platform's 39 mm root depth"
    - "outside finger bare: it is the T5 floor and the hook, and a pad would sit in the T3 and T4 contacts"
    - "hard stop at 45 deg on both fingers, or up to 1 deg past, never short: the cradle seats square only at 45 deg, so the stops hold T5 (22 - 25 N·m per gripper at 23 kg in the strength check) off the drive. Two stop arms, SR's next-phase hardware: one for the outside finger's block and one for the thumb's, each with a 2 mm 304 wear plate and a shim, set so both stops touch within the gears' backlash; with one stop short the mesh carries up to 18 N·m. Today's bracket has neither, so as built the drive holds 45 deg"
    - "hinge: the next phase's metal hinge (SR's hardware list): Ø15 h6 stainless shafts (17-4PH H1025 or 440C), keyed; four sealed 6002-2RS bearings, stainless with H1 grease over open product, in metal sleeves; steel or 7075 clamp hubs in place of the printed mount; a case-hardened module-2 steel gear pair; each finger on two captive M5 x 25 A4-70 socket screws with retaining washers, in pressed Ø9 x Ø5.2 x 12 mm stainless sleeves"
    - "operator fasteners (G2): only each finger's two captive M5 socket screws (ISO 4762), which take the cell's one 4 mm stainless hex key. The pad is cast in, so a pad change is a finger swap; the stop arms, wear plates and shims are fitted at the bench"

stroke:
  readings: [45]

materials:
  finger: common
  print_orientation: flat

notes: >
  Length. finger_reach is 150 - 160 mm, nominal 160. The flagged 170 mm run is worth it for S4.
  It lengthens the T5 floor and raises the thumb step's T1 insertion cap from 57 - 75 to
  66 - 85 mm, at about 5 % more T5 moment. It gains T4a almost nothing: the 8.1 mm pocket
  limits the hookable span to 54 mm (57 mm at 170), whatever the stroke (fp-t4a-lip-spans.py).
  Interleave. The thumb's step fills one half of the paddle's width, about 70 mm. The
  outside finger's paddle is relieved in that half at u 46 - 78, with 4 mm between the layers.
  Without the relief the step collides with the outside finger below 17.9 deg per finger
  (fp-concept-geometry.py section 1), which rules out T1 and T2. The 2D outline can't
  draw it. MuJoCo's finger geoms don't collide with each other (contype GRIP, conaffinity
  OBJ|TABLE), which matches the relief, but CAD must check the real clearance.
  T5 geometry at 45 deg: the case bottom lies along the outside finger's face line, and the wall is the
  thumb step's face line, 2.9 mm clear of the Ø35 hub, which sits 48.5 mm ahead of the pivot
  line (VAL, from the STEP). MuJoCo has no hub body, so add one before scoring T5.
  Otherwise a short step_height would show a cradle the hub would block.
  How T5's opening is held: on the l_angle stops, one per finger at 45 deg. The floor and the
  step are square to each other only at 45 deg per finger, the stop angle, and the case's
  moment opens each finger onto its own stop, so the stops engage whenever the cradle seats
  (fp-s4-s5-t5-seat.py). That needs the jaw on its stops when the case loads it: the arm moves
  in until the wall meets the step, then rises until the floor lifts the case, with no closing
  step. If the jaw closes onto the case first (test-conditions' T5 approach, "closes until both
  fingers touch"), it ends asin(gap / 142 mm) short of the stops, 0.4 - 2 deg for a 1 - 5 mm
  gap. The case then bears on the floor's far end and the step's far corner. At 1 deg short
  the servo or brake carries 18 - 21 N·m per gripper at rest, 24 - 30 in the 0.25 g hold test
  and 32 - 37 in the strength check, past the drive's 25 N·m peak. Set the stops at 45 deg,
  or up to 1 deg past, never short. Opening past 45 moves both contacts toward the corner (levers about 50 mm) and
  narrows the hub gap to 2.0 mm at 46 deg; the wall reaches the hub just past 48 deg.
  G1. Judged with the next phase's metal hinge (fixed_by_spec), S4 rates 23 kg at the 45 deg
  reading, on its stops on SR's two stop arms, if SR's hinge check for S3 - S5 confirms it. Nothing else limits it
  at 23 kg. The finger beyond a stop sees at most 0.4 MPa (0.7 with K_t 2), and the step bears
  in compression. The stop blocks bear 0.5 MPa at most, and 0.33 MPa held for 10 minutes. With
  the stops on the paddles, each root carries only 22 - 96 N and 0.8 - 3.5 N·m, well inside the
  steel clamp hub and sleeves. The mesh carries nothing while both stops touch, and at most the
  outside finger's 18 N·m if they don't touch together, so each wear plate is shimmed. The drive and brake carry no T5 load,
  so the drive's 25 N·m peak doesn't set the rating. With the motor off the stops hold the L,
  so the case survives the power cut. The 14 mm knuckle is a free end and carries nothing
  (VAL R5.2). As built, today's bracket has no stop, so the drive holds 45 deg and the case's
  moment passes through the printed mount: S4 rates about 9.6 kg there (VAL R6.2), and SR
  rates the printed hinge about 11 - 14 kg on tip-bearing loads. So S4's jaw is set at 45 deg,
  or up to a degree past, never short. A degree short, the case rides on the floor's tip and
  the mount rates 5.4 kg for a short lift (3.2 kg held), and a 1 g stop at 5 kg takes the
  mount's arm to 19 MPa and its screw floor to 16, against 16 (VAL R6.2, R8.3).
  G2. The operator touches only each finger's two captive M5 socket screws, on the cell's one
  4 mm stainless hex key. The thumb pad is cast through keying holes in its seat, so it can't
  come off alone, and it changes with the finger. Nothing else comes off.
  The analytic screen can't run this concept (asymmetric), so it gets MuJoCo evaluations only.

expected:
  T1: "MuJoCo only. Passes the light boxes and is panel-limited on heavy ones. The thumb's step caps insertion at 57 - 75 mm, so the grip lands above most fill lines, bare at mu 0.3 on one side and padded at 0.5 on the other (F2)."
  T2: "Like the platform: the flush shoulders meet at -0.46 deg and pinch bare at mu 0.30 - 0.35. Holds light sheets (F1)."
  T3: "Enters the 3 mm gap. The chisels are toed in 15.5 deg against a 16.0 deg CFS grasp angle, so they lean 0.5 deg and need a 2.55 mm gap; at 1.3 mm they push a neighbour 1.25 mm (F3, fp-t3-chisel-lean.py). At every range corner they need at most 2.59 mm, a 1.29 mm push, within the neighbour's 1.3 mm of free travel, and the shoulder stays above the 15 mm entry. The flagged 170 mm run needs 2.67 mm at nominal and 2.83 at its worst corner, inside the 3 mm limit (fp-t3-chisel-lean.py --corners)."
  T4: "Passes T4b and fails T4a. T4b: the outside seat takes 110 N, the thumb's pad holds the inner wall at mu 0.4, and the drive holds a 1.5 N·m opening moment (F4). T4a: the lip fits the 8.1 mm pocket only up to about 8.5 deg of jaw angle, so S4 hooks spans up to 54 mm (57 at 170). The 212 mm bin needs a pocket about 20 mm deep (fp-t4a-lip-spans.py). Strength: the tooth's neck sees 9.8 MPa held level with K_t 2 at nominal and 13.2 at the worst corner, against 16 (fp-t4-tooth-neck.py)."
  T5: "Holds on its 45 deg stops, off the drive. The faces seat square only at 45 deg, the stop angle, and the case's moment opens each finger onto its own stop. The floor's resultant is about 89 mm out and the thumb's step bears 57 - 83 mm up the wall, so the stops carry 22 - 25 N·m per gripper at 23 kg in the strength check, 16 - 20 in the 0.25 g hold test and 12 - 14 at rest (equal to 60/40 share), against 37 - 45 for the tip-bearing concepts. Rated 23 kg on SR's stop arms (G1, notes); as built, about 9.6 kg with the drive holding 45 deg, and 5.4 kg a degree short, so the jaw is set at 45 deg or up to a degree past, never short (VAL R6.2). If the approach closes the jaw onto the case instead, it sits 0.4 - 2 deg short and the servo carries 32 - 37 N·m in the strength check at 1 deg short (fp-s4-s5-t5-seat.py, F5 rework)."

tradeoffs:
  - "Halves T5's moment against tip bearing, but needs the stop, so it runs at 45 deg only"
  - "The thumb's step caps T1 insertion at 57 - 75 mm (66 - 85 at 170)"
  - "One bare finger: T1 friction is 0.3 on that side"
  - "MuJoCo only, so fewer search evaluations"
  - "The relief halves the outside finger's paddle width at u 46 - 78"

risks:
  - "Interleave clearance under out-of-plane load: the step could clash with the outside finger's relieved layer"
  - "The step bears in one half of the width, a torsion on the thumb's root (about 4 N·m at 23 kg) that 2D can't see"
  - "Which finger is outside depends on the arm: a gripper mounted the other way round has the step on the wrong finger"
  - "MuJoCo's missing hub body and finger-finger contact hide the two failure modes this concept is built around"
  - "A box top edge can catch on the step's square distal face if the descent overshoots"
  - "If the cell closes the jaw onto the case instead of lifting it onto the cradle, S4 sits off its stops and the drive must hold 32 - 37 N·m in the strength check, past its 25 N·m peak"
