# S2 Deep reach (tooth-grip claw): batch 1, author SR (subagent bc-19ae4ad9-21c1-5f6c-8119-69c7810d0cde).
# Written from concept-spec-template.yaml revision 2, against test-conditions.md revision 2.
# Frame: graspsim2d finger-local, mm. u along the finger, v inward; the face plane is v = 17.75.
# Geometry check: internal/gripper-review/scripts/sr-spec-check.py.
# The lane is reworked (see notes): the box pads go on the tooth beyond the undercut, and the arm is set back.

id: S2
name: Deep reach claw
author: SR
batch: 1
status: proposed
moving_parts: none
idea: >
  Use the full 160 mm to grip boxes on the cereal-backed panel, low on the box, with Parth's
  undercut and chisel kept. Pads behind the undercut can't do that: with the pocket and the
  tooth in the last ~48 mm, a pad on the main face meets the box at its top edge, which is
  below the fill line on none of the catalog. So the box pad moves onto the tooth
  beyond the undercut, the only part that reaches deep. Behind the tooth the arm steps out
  16 to 30 mm on a steep root ramp, so the box's top edge passes it, and the tooth alone
  meets the box side. The finger becomes a claw: a straight, set-back arm, 16 to 24 mm deep
  and 100 mm wide, ending in a tooth that stands back up to the face plane. The tooth carries
  a short PU pad behind a dam, with the chisel stepped back 5.5 mm beyond it and toed in about
  14 deg so it hangs plumb at the T3 grasp angle. The space between
  the arm and the tooth is the crate undercut, and the tooth's level-cut back face hooks the
  lip. Compared with the platform, the paddle and its face are gone and the grip moves 80 mm
  toward the tip. Compared with S5's crank, the distal contact is short and sits on the tooth,
  not a long parallel face, and the step is at the root, where T5's moment is carried by the
  widest section.

strategy:
  T1: "Deep side grip. The box's top edge rides past the set-back arm, and the tooth pad meets the box side 85 to 92 mm below its top at 160 mm, below the fill line on 7 of the 8 library boxes. CFS is the exception at 75 to 87 mm against 91 mm of headspace."
  T2: "The tooth pads meet at the 2.5 mm closed gap, so the sheet is pinched pad to pad over 8 to 11 mm, inside the 30 mm band. The chisels are 5.5 mm back and stay off it."
  T3: "The chisel's toe-in follows the reach (14.0 deg at nominal), so at CFS's 14.5 deg grasp angle it hangs within 0.6 deg of plumb at every reach, the flagged 170 mm included. The inserted 15 mm sweeps 2.1 mm: a 0.8 mm push at a full case's 1.3 mm gap and none at 3 mm, and 2.16 mm at the worst range corner (2.17 at 170 mm), inside the neighbour's 1.3 mm of free travel. The pad's distal corner sits 15.6 mm above the point at that angle (at least 15.3 across the ranges), so it lands on the target's top edge just past the 15 mm entry, and the 20 mm sensitivity isn't reached. The toe-in is set for CFS: on 60 and 45 mm boxes the tip sweeps 3.6 and 4.3 mm (sr-spec-check.py; fp-t3-chisel-lean.py agrees on CFS)."
  T4: "The tooth (26 to 29 mm, far wall to tip) fits the 30 mm of free wall. The far wall, level-cut or back-cut by up to 2 mm, carries the lip on printed PA12 at the dam, not on the pad's edge. The pocket is 16 to 30 mm deep."
  T5: "The case bears on the tooth pad's distal end at about 30 deg per finger, 144 mm from the pivot, on the pad and not the chisel. The actuator holds the opening, backed by a power-off brake."
  durability: "A 16 to 24 mm arm 100 to 110 mm wide, 30 mm at the ramp, a 6 mm root fillet at the ramp's foot and 3 mm at the far wall. The pad sits behind a printed dam and is the only wear part."

fingers:
  symmetric: true
  asymmetric_for: []
  outside:
    root: platform
    outline:
      - [46.0, 17.75]                                                          # root junction (the platform's face)
      - ["46 + ramp_len", "17.75 - arm_offset"]                                # steep root ramp: the arm steps out (6 mm root fillet at its foot)
      - ["finger_reach - tooth_len + far_backcut", "17.75 - arm_offset"]       # arm inner face to the far wall's foot (3 mm root radius)
      - ["finger_reach - tooth_len", "16.25 - tooth_wedge"]                    # far wall mouth: the dam's top, 1.5 mm below the pad's proximal edge
      - ["finger_reach - tooth_len + 2.5", "16.25 - tooth_wedge"]              # printed dam, 2.5 mm long
      - ["finger_reach - tooth_len + 2.5", "17.75 - tooth_wedge - pad_thickness"]  # pad seat, proximal end
      - ["finger_reach - chisel_len", "17.75 - pad_thickness"]                 # pad seat, distal end
      - ["finger_reach - chisel_len + 1.5", "17.75 - chisel_setback - ((chisel_len - 1.5) * tan(radians(13.96 + 0.093 * (160 - finger_reach) - 0.36 * (chisel_setback - 5.5))))"]  # step to the chisel's root; the pad's distal corner is the T3 depth stop
      - ["finger_reach", "17.75 - chisel_setback"]                             # chisel inner face, toed in to the point
      - ["finger_reach", "17.75 - chisel_setback - tip_land"]                  # the land
      - ["finger_reach - chisel_len", "17.75 - chisel_setback - (chisel_len * tan(radians(13.96 + 0.093 * (160 - finger_reach) - 0.36 * (chisel_setback - 5.5)))) - chisel_t"]  # chisel back at its root, toed in with the face
      - ["finger_reach - chisel_len", "17.75 - arm_offset - arm_depth"]        # tooth's distal face, down to the arm's back
      - ["46 + ramp_len", "17.75 - arm_offset - arm_depth"]                    # arm back
      - [46.0, -21.25]                                                         # root junction (the platform's back)
    body_width_mm:              # the arm is widened to 100 mm so the tooth pad keeps the 25 kPa bed limit at 20 to 27 N
      - [46, 155]
      - [70, 110]
      - [90, 100]
      - ["finger_reach - chisel_len", 100]
      - ["finger_reach", 80]
    pads:
      - name: tooth
        role: all               # T1 boxes, T2 sheets, and the T5 bearing and wall contacts
        side: inner
        face: [["finger_reach - tooth_len + 2.5", "17.75 - tooth_wedge"], ["finger_reach - chisel_len", 17.75]]
        crown_radius_mm: null
        thickness_mm: "pad_thickness"
        shore_a: "pad_shore"
        width_mm: 100
        material: "cast PU in its seat, held mechanically by the printed dam, the chisel step and two dovetail grooves along the seat, and bonded; blue, metal-detectable grade"
    features:
      tip:
        thickness_profile_mm:
          - ["finger_reach", "tip_land"]
          - ["finger_reach - chisel_len + 1.5", "chisel_t"]
          - ["finger_reach - chisel_len", "arm_offset + arm_depth"]
      undercut:
        u_from: "46 + ramp_len"
        u_to: "finger_reach - tooth_len"
        depth_mm: "arm_offset - 1.5"
        root_radius_mm: 3
        side: inner
        purpose: "seats the crate's rim lip (test-conditions.md, T4) against the tooth's far wall, and keeps the arm clear of the box's top edge in T1. Place the T4 lip at the far wall, u_to."
      hard_stop:
        type: end_of_stroke
        opening_deg: 90
        where: "a printed shoulder on each finger's root against the bracket, faced with a 2 mm 304 stainless wear plate on captive M3 A4 screws, fitted at the bench. It sits at the end of the stroke: 90 deg, or 45 deg under the included-angle reading."
  inside: same

search:
  base_concept: new
  existing_variables:           # for a new concept: the existing variables the expressions and pads use, with narrowed ranges
    active: [finger_reach, finger_torque, pad_thickness, pad_shore]
    fixed: {}
    narrow:
      finger_reach: [150, 160]
      finger_torque: [1.0, 8.0]
      pad_thickness: [3, 6]
      pad_shore: [40, 60]
    nominal:
      finger_reach: 160
      finger_torque: 3.0
      pad_thickness: 4
      pad_shore: 50
  new_variables:
    arm_offset: {range: [16, 30], unit: mm, nominal: 26, meaning: "how far the arm's inner face sits outward of the face plane; the tooth stands this proud of the arm. Deeper boxes need more: CFS gains 8 mm of contact depth from 24 to 30"}
    tooth_wedge: {range: [0, 3], unit: mm, nominal: 2, meaning: "pad face's proximal end sits this far below the face plane (up to about 20 deg over the 8 mm pad), so a leaning box meets the whole pad, not its proximal edge"}
    arm_depth: {range: [16, 24], unit: mm, nominal: 20, meaning: "in-plane depth of the set-back arm (batch rule: beam at least 15 to 20 mm)"}
    ramp_len: {range: [8, 16], unit: mm, nominal: 12, meaning: "u length of the root ramp from the platform face down to the arm (steeper lets boxes in deeper)"}
    tooth_len: {range: [27, 29], unit: mm, nominal: 28, meaning: "far wall to tip; must fit the 30 mm of free wall under the T4 lip"}
    far_backcut: {range: [0, 2], unit: mm, nominal: 1, meaning: "far wall's foot runs this far distal of its mouth (0 = level-cut)"}
    chisel_len: {range: [17.5, 18], unit: mm, nominal: 17.5, meaning: "chisel length from the step to the point; at least 17.5 keeps the pad's distal corner above the 15 mm T3 line at CFS's grasp angle; each mm more shortens the tooth pad by 1 mm"}
    chisel_t: {range: [2.0, 2.5], unit: mm, nominal: 2.4, meaning: "chisel thickness at its root, across u; it tapers to tip_land at the point"}
    tip_land: {range: [0.8, 1.1], unit: mm, nominal: 1.0, meaning: "land at the point"}
    chisel_setback: {range: [5.5, 6], unit: mm, nominal: 5.5, meaning: "the point's set-back from the face plane, so the T5 case and the sheets bear on the pad, not the chisel"}
    # chisel toe-in, derived and no longer searched (S1's formula): the face's root end sits (chisel_len - 1.5) * tan(13.96 + 0.093 * (160 - finger_reach) - 0.36 * (chisel_setback - 5.5) deg)
    # further out than the point, written into the outline. 3.92 - 4.39 mm over the ranges, 3.98 at nominal (14.0 deg);
    # it keeps the chisel 0.5 deg short of plumb at CFS's T3 entry opening for every reach, fitted for 150 - 160 mm (worst corner needs a 2.16 mm gap, against 2.6);
    # the flagged 170 mm run extrapolates it: 3.65 - 3.82 mm, 0.6 deg of lean, 2.17 mm worst gap and no corner landing
  fixed_by_spec:
    - "root and hinge (u <= 46), the platform's: a hardware rule"
    - "face plane v = 17.75 at the tooth pad: keeps the platform's 2.5 mm closed gap for T2"
    - "dam 2.5 mm long and 1.5 mm below the face plane: the lip bears on printed PA12, not on the pad's edge"
    - "pad and body width 100 mm: the bed-pressure limit (25 kPa) at 20 to 27 N needs about 1,000 mm2 of pad"
    - "chisel step 1.5 mm long, as S1"
    - "hinge: the next phase's metal hinge (SR memo, hardware list): Ø15 h6 stainless shafts (17-4PH H1025 or 440C), keyed; four sealed 6002-2RS bearings, stainless with H1 grease over open product, in metal sleeves; steel or 7075 clamp hubs in place of the printed mount; a case-hardened module-2 steel gear pair; each finger on two captive M5 x 25 A4-70 socket screws with retaining washers, in pressed Ø9 x Ø5.2 x 12 mm stainless sleeves"
    - "operator fasteners (G2, GM-A13): only each finger's two captive M5 x 25 socket screws (ISO 4762), on the cell's one 4 mm stainless hex key. The pad is cast in, so a pad change is a finger swap; the stops' wear plates are fitted at the bench"

stroke:
  readings: [45, 90]

materials:
  finger: common
  print_orientation: flat

notes: >
  Lane rework: I've kept the lane's aim, which is to use length to grip below the fill line,
  and its rules (chisel, undercut, T5 section). I've changed where the box pad goes, because
  the lane's own geometry defeats it. A pad behind the undercut sits at least 46 mm from the
  tip, and a straight face meets a box only at its top edge: 0 to 3 mm down on every box in
  the 185-row catalog, which is below the fill line on none of them at any length or fill.
  Only the tooth beyond the undercut reaches deep. It can meet the box side only if
  everything proximal stands back by about (u_tooth - u_top) tan(phi), 17 to 30 mm, hence
  the set-back arm. I'm telling the project manager. S5 stays distinct: S5 is a crank with a
  long parallel distal face for the T5 cradle, and S2 is a short tooth contact with the step
  at the root.
  Length: the main search runs 150 to 160 mm, nominal 160. The flagged 170 mm run is worth
  it for S2, more than for any lane I've worked. The cap rises from 110.5 to 120.5 mm, and
  the tooth contact moves about 10 mm deeper. I checked first contact on rigid outlines at the
  deepest insertion whose first touch is the tooth (scripts/sr-spec-check.py --coverage). On
  the 185-row catalog at the catalog's fill, the tooth lands below the fill line on 33 to 37 %
  of boxes at 160 mm and 57 to 71 % at 170 mm, the upper figures at arm_offset 30 and
  tooth_wedge 3. Loose from the plant (x1.09) that is 85 to 89 % and 93 to 95 %; settled after
  a truck ride (x1.09/1.18), 10 % and 22 to 25 %; at 150 mm, 14 to 15 % at the catalog's fill.
  Cheerios Family Size, 91 mm of headspace, gets 75 to 87 mm at 160 and 98 mm at 170. So the 170 mm run is
  what brings it, and the catalog's 80 to 95 mm headspace class, below the fill line. The
  cost is 6 % more T4 and T5 moment, and a 170 mm finger is flagged, not dropped. Run it at
  arm_offset 28 to 30.
  T5's opening is held by the actuator, as every concept runs, plus a power-off brake (EE),
  with metal gears. No L-angle stop: the case bears at about 30 deg per finger, so a 45 deg
  stop is never loaded (FP F5).
  T4a needs the teeth, at u about 132, to clear the 212 mm lip span. That takes about
  50 deg per finger, so at the 45 deg reading S2 can't span T4a's crate and only T4b runs.
  The 90 deg reading is fine.
  Chisel: the toe-in follows FP's chisel-lean check. The round-3 straight chisel leaned 18.3 deg
  at CFS's grasp angle and needed an 11.0 mm gap, or 5.0 mm where the pad's corner stopped the
  entry at 14 mm. Toed in to CFS's angle and lengthened from 16.5 to 17.5 mm, so the pad's
  corner clears the 15 mm line, it needs 2.1 mm. The extra 1 mm comes off the tooth pad, now
  8 mm at nominal; 18 mm would cost another 0.5 mm. The 5.5 mm setback keeps the T5 bearing on
  the pad at every corner of the ranges.
  General Mills' gates. G1, T5 safety (SR's figure; GM re-rates all six): judged with the next
  phase's metal hinge, steel clamp hubs and stainless sleeves (fixed_by_spec) and the reference
  drive, S2 rates about 13 kg (12.8), set by the drive's 25 N m peak in the lift: the strength
  check needs 45.0 N m per gripper at 23 kg (x1.5, 60/40), the most of the three. The case is
  held up to 10 minutes on the drive's spring-applied power-off brake, never on motor current;
  there is no T5 stop. At rest 23 kg needs 23.6 N m, inside the reference 30 N m brake, which
  also carries the strength-check load up to 15.3 kg, so a power cut mid-move is covered at the
  rating. With the next phase's drive (at least 50 N m peak) and brake (at least 70 N m), S2
  rates 23 kg, the test's ceiling; the first item to bind above it is that drive's peak, at 25.5
  kg. The rest clear 23 kg: the arm 4.0 MPa with K_t 2 (u 70, 20 by 110 mm) and the tooth's base
  at most 6.4 MPa with the pad's full friction, so 43 kg held at rest against 8 MPa; the root 4.7
  MPa with K_t 2 at the outer M5 (u 52), with the 14 mm knuckle a free end (SR memo, VAL-Q8);
  the sleeves 7.2 MPa under the outer M5; the stainless 6002-2RS bearings s0 1.35 or more, the
  lowest of the three, because the tall tooth puts the T5 load 23 mm below the lower bearing;
  the case-hardened module-2 gears 346 MPa at the tooth root (Lewis), inside a hardened gear's
  bending limit [A]. As built, on the printed mount and today's bearings, it rates about 5 kg
  for a short lift (the mount's arm with K_t 2, 5.4 kg) and about 3 kg held, and the bearing next
  to the gear reaches s0 0.95 at 12 kg, so trials follow GM's cap (SR memo, hinge check).
  Out-of-plane envelope: the arm and tooth are 100 to 110 mm tall and sit top-aligned with the
  platform root (z -1.6 to -112 in the platform frame), inside the 161 mm finger and the
  gripper's 170 mm stack (z -171 to -1), so T5's slot is 210 by 120 mm. G2, foreign material:
  nothing on S2 comes off without the cell's hex key. The tooth pad is cast in its seat and held
  mechanically by the dam, the chisel step and two dovetail grooves, as well as by the bond;
  there are no pins, springs, clips or inserts. Because the T5 case bears on the pad, the
  durability run adds GM's peel and shear test of the pad at the T5 load. GM-A13, now under G2:
  a worn pad means a finger swap at the pivot, on its two captive M5 x 25 A4-70 socket screws
  (ISO 4762), the only fasteners the operator touches, on the cell's one 4 mm stainless hex key,
  in about 5 to 10 minutes [A, to be timed on the first build], inside GM-A13's 10. The wear
  plates' M3 screws are fitted at the bench.
  Template gaps, as in S1: thickness_mm and shore_a are expressions; body_width_mm stations
  use finger_reach; existing_variables is filled for a new concept; the undercut's depth
  is an expression; and there is no field for where the widths sit out of plane.

expected:
  T1: "The strongest of my lanes: 6 to 7 of 8 boxes at 160 mm, if the sim's tooth contact matches the geometry, and CFS joins at 170 mm. A contact below the fill line lets the force rise to the 25 kPa bed limit (about 20 N on the 8 x 100 mm pad), against 9 to 20 N needed at mu 0.5 with the safety factor. The one torque must also suit the sheets, so the heaviest boxes are the ones at risk."
  T2: "Good: 5 to 6 of 6 sheets. Pad to pad over 8 to 11 mm, 100 mm wide, so pressure stays near 20 to 25 kPa at 20 N, under the 90 kPa flute limit."
  T3: "Enters: 2.1 mm swept at CFS's grasp angle (2.16 mm at the worst range corner, 2.17 at 170 mm), a 0.8 mm push at 1.3 mm and none at 3 mm; the pad's corner stops the entry at about 15.6 mm. Holding CFS on bare chisels at mu 0.3 within 10 N is marginal."
  T4: "T4b passes, with the lip on the far wall and the tooth under it. T4a can't be reached at the 45 deg reading; at 90 deg it passes."
  T5: "Supports only with the brake. 40 to 45 N m per gripper at 23 kg, at 142.5 mm. Arm stress is 4.0 MPa with K_t 2 at 23 kg and 2.1 MPa at the 12 kg duty (110 by 20 mm section at u 70); the tooth's base (9.5 mm along u by 100 mm) is at most 6.4 MPa with K_t 2, with the pad's full friction, and the root 4.7 MPa with K_t 2 at the outer M5. The printed mount's arm, 36 MPa with K_t 2 at the duty, needs the next phase's machined mount."

tradeoffs:
  - "Best T1 reach of the three, but the claw is wider. The arm's back sits 10 to 18 mm outside the platform's, so neighbours in a tight row see a wider finger above the box tops, and the closed gripper is about 20 to 36 mm wider overall."
  - "The pad is short, 8 to 11 mm, which caps the grip force at the bed limit, so the heaviest boxes need the 170 mm run's deeper contact. The T3 toe-in took 1 mm of it, for a 2.1 mm swept width in place of 11 mm; it is square only to CFS, so a full case of 45 mm boxes sees 4.3 mm."
  - "The steep root ramp lets boxes in deeper but puts a 117 deg re-entrant corner at the root, so it needs a 6 mm fillet."

risks:
  - "If the sim's contact model lets the arm's ramp touch a box top before the tooth meets the side, the T1 gain disappears. That is a geometry check for the design-search worker."
  - "The short pad on a narrow tooth is the wear item and peels at its edges. The dam protects the proximal edge from the crate lip, and the distal edge meets the chisel step."
  - "T5 relies on a brake and the next-phase hinge, as S1. S2's tall tooth and long reach load the hinge hardest of the three: 1.7 kN on the bearing next to the gear and 0.57 kN on the lower one at 23 kg, and 34 MPa nominal in the printed mount's arm (SR memo, hinge check and VAL-Q8)."
  - "The 100 mm wide arm and pad add mass and inertia, about 2 to 3 times the platform's distal arm."
