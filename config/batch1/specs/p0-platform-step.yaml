      - [113.36, 9.51]
      - [112.14, 10.00]
      - [110.70, 10.81]
      - [100.79, 17.75]
    body_width_mm: [[46, 78.5], [50, 118.5], [55, 139], [60, 132], [70, 118], [80, 104], [85, 97], [88, 63.5], [90, 28.5], [95, 27.5], [100, 26.5], [101.5, 26], [105, 26], [110, 25], [116.5, 24], [120, 23.5], [125, 22.5], [129.5, 21.5], [135, 20.5], [140, 19.5], [145, 12.5], [150, 6]]
