# STEP-built platform baseline for batch 1 (test-conditions.md rev 2.8, "Platform baseline").
# Written by the design-search worker from `Finger, Left, MV-UMI01-3DP-001 A.stp`
# (cad/gripper-umi-platform-v0.1/), not by a concept author. Geometry only; no search.
# Outline: the finger's silhouette in the jaw plane (u = y + 31, v = x + 19 for the left
# finger), so the undercut is the notch clear through the arm's whole height: a V-notch
# 8.72 mm deep at u 116.5 between face points at u 101.0 and 129.5 (walls fitted at 34 deg
# near and 41 deg far, design-search doc section 8.7). The back tapers from v -20.95 at
# u 46 to a 2.2 mm tip. The first 46 mm is the shared platform root.
# body_width_mm: the face's contact width (within 0.5 mm of the face plane) along u, and
# the arm's height across the notch. The paddle part (`Paddle, Gripper, MV-UMI01 A`) sits
# behind the blade and never touches an object, so it is left out.
id: P0
name: Platform finger from the STEP (bare)
author: design-search worker (from the STEP)
batch: 1
status: baseline
moving_parts: none
idea: The platform finger as drawn, bare PA12 at the friction table's bare values (0.3 on carton).
fingers:
  symmetric: true
  asymmetric_for: []
  outside:
    root: platform
    outline:
