        - name: FT Dynamic bracket (bot)
          heights_mm: [14.5, 67.3]
          outline_mm: [[-4.78, -47.84], [-2.47, -48.32], [-0.12, -48.5], [2.23, -48.36], [4.54, -47.9], [6.76, -47.14],
            [8.86, -46.09], [10.79, -44.78], [12.57, -43.18], [13.83, -41.72], [14.88, -40.21], [15.79, -38.55],
            [16.5, -36.83], [17.31, -33.55], [17.58, -29.17], [17.95, -26.99], [18.7, -24.69], [19.98, -22.2],
            [21.74, -19.91], [23.57, -18.21], [25.13, -17.12], [29.2, -14.83], [31.88, -12.57], [33.38, -10.82],
            [34.46, -9.21], [35.37, -7.49], [36.08, -5.69], [36.77, -2.87], [36.99, -0.43], [36.84, 2.43],
