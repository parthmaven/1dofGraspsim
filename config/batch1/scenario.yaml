    table_friction: 0.3
    materials:                    # pad on HDPE or PP 0.4; a bare finger 0.2, stainless or printed
      pp: {pad_friction: 0.4, bare_friction: 0.2, bare_friction_pa12: 0.2, modulus_MPa: 1300.0}
      hdpe: {pad_friction: 0.4, bare_friction: 0.2, bare_friction_pa12: 0.2, modulus_MPa: 1000.0}
