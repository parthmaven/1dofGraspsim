            9.35], [33.1, 11.19], [31.77, 12.68], [30.33, 13.99], [27.26, 15.99], [25.5, 16.78], [23.6, 17.4],
            [21.72, 17.79], [19.74, 17.98], [17.61, 17.95], [15.33, 17.62], [9.81, 15.97], [6.04, 15.16], [3.11,
            14.81], [0.23, 14.68], [-3.17, 14.81], [-6.12, 15.18], [-9.86, 15.98], [-15.62, 17.68], [-17.81,
            17.96], [-20.26, 17.96], [-23.05, 17.54], [-25.53, 16.77], [-27.87, 15.66], [-30.23, 14.07],
            [-32.17, 12.27], [-33.92, 10.07], [-35.17, 7.91], [-36.14, 5.49], [-36.78, 2.81], [-37, 0.11],
            [-36.83, -2.45], [-36.25, -5.14], [-35.57, -7.04], [-34.61, -8.97], [-33.37, -10.84], [-32.08,
