sequence:
  # The close lasts close_s, or longer when the jaw starts wide: the free travel from the start
  # opening to where the fingers meet, at closing_speed_rad_s, plus squeeze_s. Sheets are
  # released from the holder at the end of closing.
  close_s: 0.9
  squeeze_s: 0.3
  settle_s: 0.25
  lift_height_mm: 80
  lift_s: 0.5                 # minimum-jerk lift
  hold_s: 0.3
  shake:
    # Sinusoids with raised-cosine ramps at each end. A ramp shorter than one
    # lateral period overshoots the peak acceleration (0.25 s gives 0.68 g for
    # a 0.5 g spec) and kicks the sheets' bending modes.
    duration_s: 3.0
    ramp_s: 0.5
    lateral:  {peak_accel_g: 0.5, freq_hz: 2.0}
    vertical: {peak_accel_g: 0.5, freq_hz: 3.0}
  final_hold_s: 0.5

pass_criteria:
  # A grasp passes if the object is lifted and held through the shake without
  # slipping, crushing, or creasing the board.
  max_slip_mm: 2.0            # pad-to-object tangential slip after the grip settles
  max_rotation_deg: 10.0      # object rotation relative to the gripper
  # Crushing: peak pad pressure must stay below each object's allowable
  # (objects.yaml), and a box must not be squeezed in its unsupported headspace
  # harder than its panel force limit.
  # Creasing (sheets): bending moment where the sheet leaves the pinch must
  # stay below bending strength x width / safety factor.
  pressure_safety_factor: 1.0
  crease_safety_factor: 1.0
  crease_width: pad           # pad: only the pinched strip carries the moment (conservative)

# Multiplies every pad-on-object friction coefficient in objects.yaml
# (e.g. 0.8 for a low-friction sensitivity run).
friction_scale: 1.0

analytic:
  # Level 0 screen only; the dynamic check applies the criteria above directly.
  friction_safety_factor: 1.5
  pitch_safety_factor: 1.5

sim:
  timestep_s: 0.0001
  fine_timestep_s: 0.00005    # rev 2.16: sheets, and any run with elements of 2 mm or less; time constants stay on timestep_s
  contact_timeconst_s: 0.0002 # contacts several times stiffer than the pad element springs
  pad_element_pitch_mm: 4.0   # pad faces are split into spring elements this long
  element_frequency_hz: 250   # pad element springs are given armature to sit at this frequency
  element_damping_ratio: 0.3
  sheet_segment_mm: 50        # sheets are hinged chains; hinge stiffness = D * width / length
  servo_kp: 2.0e6             # gripper base position servo, N/m
  record_hz: 200

batch1:
  approach_clearance_mm: {box: 7.0, sheet: 4.0}   # 1 mm + 3 mm placement + half the bulge
  insertion_step_mm: 3.0          # T1 scan step; the +-3 mm corners are the neighbouring steps
  placement_mm: 3.0               # +-3 mm corners: T1 depth and lateral, T3 lateral, T4 height
  fills: {catalog: 1.0, loose: 1.09, settled: 0.9237288}   # fill heights x1.09 and x1.09/1.18
  sheet_pinch_mm: {nominal: 30, sensitivities: [20, 50]}
  bottomed_pinch_mm: 20           # at this pinch "pads bottom out" is reported, not a verdict
  box_limits:
    band_mm: 15.0                 # flap-braced top band: its own force limit, no bed pressure
    band_force_N: 15.0            # per finger; 5 - 40 N sensitivity
    band_force_range_N: [5.0, 40.0]
    band_stiff_mm: 4.0            # the band is x50 the panel's stiffness over the top 4 mm
    band_stiff_factor: 50.0
    panel_force_N: 10.0           # empty panel, per finger, interpolated across the fill line
    bed_pressure_kPa: 25.0        # only below the fill line, where cereal backs the wall
  humid_factor: 0.6               # 85 % RH: panel limit, band (9 N), C-flute thumb, shipper board
  # rev 2.16: MuJoCo's 1.25 friction margin is the friction x0.8 run holding (slip and rotation within limits),
  # with no friction-use term in any pass rule. Friction use is reported, unscored, as both fingers' mean over
  # friction_mean_ms.
  robust_friction: 0.8
  body_contact_limit_N: 1.0       # T1 - T3 only
  closing: {fast_rad_s: 1.0, slow_rad_s: 0.3, slow_deg: 5.0, armature_kgm2: 0.015}
  stop: {decel_g: [0.5, 1.0], speed_m_s: 2.0, accel_g: 0.25}
  power_cut: {brake_Nm_per_gripper: 30.0, no_brake_Nm_per_gripper: 1.0, hold_s: 5.0}
  shake_g: {T1: 0.5, T2: 0.5, T3: 0.0, T4: 0.25, T5: 0.25}
  shake_s: 3.0                    # lateral 2 Hz, vertical 3 Hz
  sheet_shake_hz: [1.5, 2.0, 3.0] # the carton blank's lateral shake, every design (its second mode is 1.84 - 2.11 Hz)
  drive_Nm_per_gripper: {continuous: [7.0, 10.0], peak: 25.0}   # both finger motors together; flag over 7
  mount_fatigue_Nm_per_finger: 3.9  # rev 2.16: flag any pinch at or above this finger torque (the arm reaches 10 MPa at 3.9 - 4.0)
  # rev 2.16: pad and marked-face elements read their load from their springs, and from the contact force only at
  # the 85 % stop (bare faces travel bare_travel_mm to theirs); the contact force spikes for single samples.
  friction_mean_ms: 10.0
  short_face_mm: 20.0             # pads and bare faces shorter than this run at fine_pitch_mm
  fine_pitch_mm: 1.5
  bare_travel_mm: 1.5             # bare-face elements travel this far before the body behind them
  # SIM's corner fix (the model change before T4): an element at a convex corner gets a second slide along the next
  # face's normal, at that face's stiffness over the 0.8 mm its end presents there. Face ends within gap_mm meet; a
  # corner counts where the normals turn by min_turn_deg or more. `corner_slide: false` builds the model without it.
  corner_slide: {gap_mm: 0.6, min_turn_deg: 30.0}
  # Rev 2.34 (Parth: the fingers will be metal): the finger's material sets its bare friction on each object and its
  # density. Stainless is selected and PA12, the printed finger, runs as the baseline. A key ending in _pa12, here and
  # in objects.yaml, gives the PA12 baseline's value of the key without it; the selected material reads the key itself.
  # Rev 2.39, the allowables: static against K_t x the nominal stress, at the ceiling load; fatigue against K_t x the
  # working stress, as an amplitude at R = 0 or as a peak. Every row on a material with an edge_note carries it.
  finger_material: stainless      # or pa12
  finger_materials:
    stainless:                    # 304 assumed (GM, SR); bare friction from VAL's handbook ranges (round 16)
      density_kg_m3: 8000.0
      # SR, 304 or 316 annealed: 205 MPa minimum yield / 3 on nominal stress; 0.4 x 515 MPa at 1e7 cycles, x 0.86
      # machined, x 0.96 size, Goodman to R = 0, / 3, with K_t 2 on top (57 MPa amplitude where a load reverses).
      # No creep line at 40 deg C. Finish, grade and washdown sensitivities are reported, not run.
      allowables: {static_MPa: 68.0, static_kt: 1.0, fatigue_amplitude_MPa: 43.0, fatigue_amplitude_reversed_MPa: 57.0,
                   fatigue_kt: 2.0, creep_MPa: null}
      edge_note: "edge break (rev 2.39, a drawing rule; the model's corners are square): R >= 0.5 mm on every
        board-bearing metal edge; a chisel tip may instead be a full round, R = land / 2 >= 0.4 mm"
    pa12:
      density_kg_m3: 1010.0
      # GM-A10's 48 / 3 at the ceiling load; 10 MPa peak to 1e6 - 1e7 cycles; 8 MPa creep at 40 deg C; K_t 2 at the
      # hub notch, the crank, the undercut root and pad pockets (SR memo F2).
      allowables: {static_MPa: 16.0, static_kt: 2.0, fatigue_peak_MPa: 10.0, fatigue_kt: 2.0, creep_MPa: 8.0}
  # Rev 2.34: the wrist F/T sensor. The finger assembly, the drive and brake, and the hub shell ride on its moving side,
  # so it reads every external contact on the jaw assembly and the pinch cancels. Its axis is the hub's, square to the
  # jaw plane.
  sensor:
    centre_mm: [0.0, -31.0]       # the hub's axis, in gripper coordinates (SR round 15)
    depth_mm: 31.5                # its mid-plane along the tool axis, below the top datum, between the brackets (SR round 16)
    # The specs don't say where a finger's widths sit along the tool axis. A full-width part, and comb layer a, hang
    # from the top of this span; comb layer b sits at its bottom (the platform finger's 155 mm paddle).
    finger_span_mm: [1.0, 156.0]
    hub_span_mm: [14.5, 67.3]     # the hub tube
    average_s: 0.005
    references: {F_N: [300, 461], T_Nm: [7, 37], Mb_Nm: [18, 65]}   # SR's, until the sensor is named
  # T5, the two-arm lift (test conditions rev 2.18). Single-wall C-flute cases, W between the arms, D out of plane.
  t5:
    cases:
      1ft: {W_mm: 305, D_mm: 254, H_mm: 254, mass_kg: 5.0, label: "1 ft case"}
      2ft: {W_mm: 610, D_mm: 406, H_mm: 406, mass_kg: 12.0, label: "2 ft case"}
      3ft: {W_mm: 914, D_mm: 457, H_mm: 457, mass_kg: 23.0, label: "3 ft case"}
      gm_case: {W_mm: 476, D_mm: 406, H_mm: 324, mass_kg: 7.0, label: "General Mills' 10-box Family Size case"}
      # Tear-away perforations around its upper third: the thumb bears 25 mm or more from them and slides 2 mm or
      # less on the print.
      shipper: {W_mm: 476, D_mm: 406, H_mm: 324, mass_kg: 7.0, thumb_limit_kPa: 25.0, label: "display-ready shipper",
                perforation_from_top: 0.3333, perforation_clear_mm: 25.0, print_slip_mm: 2.0}
    sensitivities: [[1ft, 12.0], [2ft, 23.0]]   # the heaviest cases
    ceiling_kg: 23.0              # the strength checks, every size
    material: c_flute             # a wall pressed from one side compresses over its whole caliper
    com_offset_W: 0.10            # worst case, toward one arm: the 60/40 share
    slot_mm: 120.0                # each slot's length under a gripped edge; the rest of the bottom is supported
    hub_front_mm: 48.5            # the hub holds the case corner this far ahead of the pivot line
    hub_friction: bare            # the printed bracket on the case, at printed PA12's bare friction whatever the fingers are
    preset_deg: 45.0              # the L: fingers 90 deg apart
    approach_mm: 30.0             # each arm starts this far out and moves in until the case meets the hub or a finger
    approach_m_s: 0.1
    close_rad_s: 0.3              # the jaw closes until both fingers touch, then a stiff position servo holds it
    jaw_servo_Nm_rad: 2.0e4       # per finger motor
    squeeze_N: 30.0               # per side, pressed by the arms, for the hold test
    strength_squeeze_mg: 0.5      # per side, in the strength check
    squeeze_s: 0.4
    deck_friction: 0.4            # case on deck
    stop_g: 1.0                   # one horizontal stop along W, as from 2 m/s, after the shake
    final_hold_s: 1.5             # after the shake: 0.5 s to settle, then the last 1 s gives the sustained hub force
    # rev 2.21, each gripper's hub force: sustained, the mean over the final hold's last 1 s; peak, the largest
    # 5 ms average from the stop (with no stop, the power cut) to 5 s after it
    hub_sustained_s: 1.0
    hub_peak_avg_s: 0.005
    hub_peak_window_s: 5.0
    max_tilt_deg: 10.0
    thumb_limit_kPa: 105.0        # C-flute; every case also reports the thumb against the 25 kPa bed limit
    bed_limit_kPa: 25.0
    # SIM round 12: the jaw drive is capped at its peak (drive_Nm_per_gripper) and the brake at 30 N m; a run that
    # needs more back-drives. The hold's mean torque is read against the drive's continuous rating.
    cap_drive: true
    # Rev 2.39: the root's fatigue margin is on the hold's working stress x 1.5 (read at 12 kg), beside the static
    # check on the 5 ms peak (read at 23 kg).
    root_fatigue_factor: 1.5
    # SIM round 12's footprint rule, read in the sim on each finger's 5 ms window: flush where tilt x length is at
    # most flush_mm; an edge reads force per width against the pressure limit x the flute pitch (0.84 N/mm on
    # C-flute, 0.20 on the shipper).
    flush_mm: 0.25
    edge_pitch_mm: 8.0
    # rev 2.18: S1, S2, S3 and S6, on the brake, cut power mid-move and then make the 1 g stop, at the rated mass on
    # the 2 ft case; the bare printed finger on corrugated at 0.35 and 0.28 (x0.8), and 0.24 as a sensitivity.
    # Rev 2.34: stainless on corrugated is 0.30, so the sensitivity is 0.8 x 0.30, the same 0.24.
    # Rated masses on the reference drive, from each spec's G1 text (S3's at the 60/40 share).
    midmove_cut: {case: 2ft, designs: [S1, S2, S3, S6], bare_mu_sensitivity: 0.24, bare_mu_sensitivity_pa12: 0.24,
                  rated_kg: {S1: 13.8, S2: 12.8, S3: 14.0, S6: 13.3}}
    gear_friction_Nm: 1.0         # per gripper, with the drive off: the stop-held runs and the no-brake case
    # Block 5 of the batch-1 plan: S5 at both readings, S4 at 45 deg, and the other four and the platform for
    # comparison. S3 and S4 are built for the 45 deg reading (their L-angle stop).
    block:
      designs: {P0: [45, 90], S1: [45, 90], S2: [45, 90], S3: [45], S4: [45], S5: [45, 90], S6: [45, 90]}
      stop_seated: {S4: [45], S5: [45]}           # rev 2.13: the jaw stays on its 45 deg stops
      stop_held: {S3: [45], S4: [45], S5: [45]}   # fixed L-angle stops, the 45 deg reading only
      stop_held_cases: [[2ft, null], [3ft, null]]
      nobrake_case: 2ft
      shake_sensitivity: {case: 2ft, g: 0.5}
  # T3, tips between boxes (test conditions rev 2.21): Cheerios Family Size for the target and both neighbours,
  # face to face on the shelf along the jaw axis. No shake at either level. Each design runs at its 45 deg reading.
  # The boxes' top edges are square; a tip that lands on one reports the edge radius that would cam it in.
  t3:
    box: gm_cheerios_family_18oz
    fill: catalog
    gap_mm: 1.3                   # a full case, at the top edge
    gap_sensitivities_mm: [0.0, 3.0]  # touching at the top edge; a partly emptied case
    blocked_after_mm: 1.3         # a neighbour slides one more gap before the next box stops it
    entry_mm: 15.0                # the tips reach this far below the box tops
    entry_sensitivity_mm: 20.0
    clear_mm: 3.0                 # the tips start this far above the box tops
    descend_m_s: 0.05
    entry_settle_s: 0.1
    lift_mm: 50.0
    hold_s: 1.0
    jaw_servo_Nm_rad: 2.0e4       # the jaw holds its entry opening on its servo, up to the drive's peak, until it closes
    shelf_friction: 0.35          # a neighbour on the shelf
    carton_friction: 0.4          # carton on carton: the target against a neighbour or the case wall
    # The tips sliding in between boxes, at the top of the bare finger's range since more drag is worse: stainless
    # 0.15 - 0.30 (VAL), PA12 0.5. The robust run takes x1.2.
    drag_friction: 0.30
    drag_friction_pa12: 0.5
    robust_drag: 1.2
    push_limit_mm: 3.0            # entry, per neighbour, measured at its top edge
    push_limit_N: 5.0             # the neighbours only: a mark inside the shipping case does no harm
    push_average_s: 0.005         # the push force is scored, and the descent stops on it, as a 5 ms average
    push_check_average_s: 0.010   # recorded beside it as a convergence check (SIM round 10)
    edge_sensitive_N: 4.0         # a 5 ms push above this is flagged as sensitive to the edge contact's stiffness
    # A neighbour's top edge dents under a tip: the tip meets it through a critically damped contact at this time
    # constant (about 50 N/mm at the corner), against MuJoCo's stiff default, on which a free box chatters.
    edge_contact_tc_s: 0.002
    edge_radius_sensitivity_mm: 0.5  # the edges are square; a landed row reports whether this radius would cam it in
    drag_limit_mm: 2.0
    case_wall: {flex_mm: 5.0, at_N: 20.0, thickness_mm: 4.0, mass_kg: 0.05}   # the first box out
    # Revision 2.23: T3 is judged on the centred runs, the gap sensitivities and the first box out. These cases are
    # reported, not rated.
    reported_cases: ["corner", "entry"]
    designs: {P0: [45], S1: [45], S2: [45], S3: [45], S4: [45], S5: [45], S6: [45]}
  t4:
    mass_kg: 15.0
