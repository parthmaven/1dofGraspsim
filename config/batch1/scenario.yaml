# Batch 1 (simple-shape concepts): the shared scenario with test-conditions.md revision 2.12
# (10:46 UTC). The block `batch1:` holds the values the first pass didn't have. Everything else is the first pass's
# config/scenario.yaml, unchanged where the test conditions agree with it.
# How each object is presented, the motion sequence, and what counts as a
# successful grasp. Defaults until Parth says otherwise; every value is
# configurable.

presentation:
  box:
    # Cereal box standing upright on a table. The gripper comes straight down,
    # centred, and the jaw closes across the box depth (front to back panel).
    # How far the box goes into the jaw is the robot's choice per known object:
    #   best:           try insertion_scan depths from the pad-registered depth
    #                   down to max_insertion_mm and keep the best grasp
    #   pad_registered: box top sits clearance_mm above the proximal end of the
    #                   box-gripping pad, so the whole pad meets the box
    #   fixed:          insertion_depth_mm for every design
    fixture: table
    insertion: best
    insertion_scan: 5
    clearance_mm: 5
    insertion_depth_mm: 70    # fixed mode: box top this far above the fingertip line
    max_insertion_mm: 121     # never deeper than this; the hub keep-out caps 170 mm fingers at 120.5 (VAL R9.4)
    lateral_offset_mm: 0
  sheet:
    # Sheet held edge-up in a holder; the jaw pinches near the free top edge,
    # the way the old box flaps were pinched (lit review 8.1: 20-40 mm, 30 ref).
    # The holder lets go once the jaw has closed, and the sheet then hangs.
    fixture: holder
    insertion: fixed
    insertion_depth_mm: 30
    lateral_offset_mm: 0

gripper:
  count: 1                    # one gripper grasps each object (not a mirrored pair)
  torque_mode: fixed          # one drive torque (design variable) for every object
  closing_speed_rad_s: 1.0    # free closing speed; sets drive damping
  closed_limit_deg: -25       # finger angle at full close (negative = converging)
  # The two fingers are geared 1:1 (equal and opposite rotation about their
  # pivots), as on the platform gripper; the sim couples the joints exactly.
  keep_out:
    # FT Dynamic bracket (top), MV-UMI01-3DP-001 A, seen in the assembly's top
    # view, fixed to the gripper body. Its plate carries the two pivots (R5
    # bosses at +-19, -31 in the assembly frame) and a 35 mm diameter hub at the
    # origin, i.e. on the jaw centreline 31 mm from the pivot line, toward the
    # fingertips. The hub continues down as the 35 mm tube of the FT Dynamic
    # bracket (bot), to 67 mm below the top of the arm. The platform finger
    # (Finger, Left, MV-UMI01-3DP-001 A) clears it with an R18.50 notch
    # concentric with the hub in the modelled pose (1.00 mm radial gap) down to
    # about 80 mm below the top; only below the tube does its face reach further
    # back. In 2D the region is treated as full height and swept over the whole
    # stroke, so objects stay out of it too.
    circles:
      - {name: ft_bracket_top_hub, center_mm: [0.0, -31.0], radius_mm: 17.5}
    clearance_mm: 1.0         # extra radius: the platform finger's notch gap
    min_ligament_mm: 5.0      # finger material that must remain beside the cutout
    blocks_objects: true
    # Both FT Dynamic brackets in plan, from the CAD (union of sections every
    # 0.2 mm, simplified to 0.1 mm), in gripper coordinates. heights_mm is the
    # depth below the assembly's top datum; the finger spans 1 - 162 mm. Top
    # bracket: 1 - 14.5 mm. Bottom bracket: 14.5 - 67.3 mm, the hub tube and a
    # plate that rings both pivots and runs 38 mm back behind them. They are not
    # cut from the fingers: each candidate must clear them over its whole stroke
    # or it is infeasible. The hub circle above is checked on its own, and so is
    # the hinge: within hinge_radius of a pivot the bracket's pivot lobe (R18)
    # and the finger's hinge share the axis at different heights. Every
    # candidate keeps the platform finger's root, the first root_length mm ahead
    # of the pivot line: at the brackets' heights it has material only on its
    # outer side. In 3D the platform jaw (finger, paddle and hinge interfaces)
    # clears both brackets at jaw angles of -1.5 to 130.5 deg from the finger as
    # drawn; at -2 and at 130.75 deg the finger meets them. Each stroke must lie
    # in root_clear_deg. The 2D check covers the rest of the finger and every
    # pad and pad mount.
    brackets:
      hinge_radius_mm: 18.5
      hinge_centres_mm: [[-19.0, 0.0], [19.0, 0.0]]
      root_length_mm: 46.0
      root_clear_deg: [-1.5, 130.5]
      footprints:
        - name: FT Dynamic bracket (top)
          heights_mm: [1.0, 14.5]
          outline_mm: [[13.98, -41.52], [15.59, -38.96], [16.73, -36.13], [17.35, -33.25], [17.58, -29.24], [17.88,
            -27.31], [18.75, -24.56], [19.85, -22.41], [21.25, -20.47], [23.29, -18.44], [25.23, -17.06],
