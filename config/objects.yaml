# Box tables: CSV files with one box per row, loaded after `boxes`, with the
# columns product_title, size_label, upc, net_mass_g, box_mass_g, height_mm,
# width_mm, depth_mm, fill_height_mm, com_height_mm, bulk_density_g_cm3,
# source, confidence. A blank fill_height_mm falls back to the bulk density
# (net mass / density / footprint), then to fill_fraction; a blank
# com_height_mm uses the carton-plus-contents estimate; a blank box_mass_g
# uses the carton blank area times the board grammage. A relative file is
# relative to this YAML file. A row's id is id_prefix plus its UPC unless
# `names` (keyed by UPC) gives a short id and label. Rows with confidence
# `placeholder` are labelled so. general_mills_cereal_boxes.csv is a copy of
# the General Mills catalog (docs/general-mills-cereal-boxes.csv in the
# project store), which so far holds Cheerios Family Size: 94 mm deep, fill
# and centre of mass modelled from its bulk density.
box_tables:
  - file: general_mills_cereal_boxes.csv
    material: cereal_carton_flakes
    id_prefix: gm_
    names:
      "016000170032": {id: cheerios_family_18oz, label: "Cheerios Family Size 18 oz"}

# Sheet size is an assumption: 400 mm hanging below the pinched edge, 400 mm wide.
sheet_defaults:
  hang_length_mm: 400
  width_mm: 400

sheets:
  - {id: chipboard_0p5mm, label: "Chipboard 20 pt (0.51 mm)", material: chipboard_20pt}
  - {id: chipboard_0p8mm, label: "Chipboard 30 pt (0.76 mm)", material: chipboard_30pt, enabled: false}
  - {id: chipboard_1p5mm, label: "Chipboard 60 pt (1.52 mm)", material: chipboard_60pt}
  - {id: e_flute_1p6mm, label: "E-flute corrugated (1.6 mm)", material: e_flute}
  - {id: b_flute_3mm, label: "B-flute corrugated (3.0 mm)", material: b_flute}
  - {id: c_flute_4mm, label: "C-flute corrugated (3.9 mm)", material: c_flute}
  - {id: bc_double_6p8mm, label: "BC double-wall (6.8 mm)", material: bc_double_wall}
