# Predefined objects: filled cereal boxes and cardboard sheets.
#
# Values come from the object-library source review (2026-11-26). Labels:
# [P] primary (paper, standard, regulation, round robin), [V] vendor datasheet
# or maker spec sheet, [R] retailer listing, [S] secondary, [E] estimate
# derived from the others. Ranges are kept next to the value used so a
# sensitivity run is a config edit.
#
# Grasp plane: a box stands upright, the gripper comes down on its top end
# (the shortest end) and the jaw closes across the depth D, so the 2D section
# is the D x H side panel and the width W is out of plane. Setting
# box_defaults.grasp_axis (or a box's own grasp_axis) to `width` closes across
# W instead. A sheet hangs from a pinch near its free top edge; the section is
# caliper x hanging length and the sheet width is out of plane.

meta:
  compiled: 2026-11-26
  grain_direction: >
    Unknown for both cartons and sheets. Sheets use the cross-direction (CD)
    bending stiffness and strength, the weaker of the two.

materials:
  # ---------------------------------------------------------------- boxes
  cereal_carton_flakes:
    # Coated recycled board (CRB) 18-20 pt, the US cereal-carton grade.
    caliper_mm: 0.48            # 0.46-0.51 [V PaceSetter, Rock-Tenn, Greif Tama]
    grammage_gsm: 380           # 360-400 [V]; UK cartons 323-420 [P WRAP 2009]
    # Pad on printed/varnished carton: no direct measurement. Proxies give
    # 0.45-0.9 static (silicone/NBR on board [P], rubber on cardboard 0.5-0.8 [S]);
    # the review recommends 0.6 static, 0.9 x static kinetic. Design value: 0.5.
    friction: 0.5
    # Pad on the panel where product backs it: the panel spreads the load into
    # the cereal bed. No measured bed stiffness was found [E]: 0.6 MPa over 30 mm.
    contact_modulus_MPa: 0.6
    contact_depth_mm: 30
    # Flake and puff breakage starts at 15-40 kPa bed pressure [E from P:
    # Lewicki 2007 corn-flake bed 16 kPa first fracture, 35 kPa peak; puffed rice
    # crushes above 40 kPa, EPJ Conf 2025]. Board ZD yield (1.4-3.6 MPa [P]) is
    # far higher, so product breakage and panel denting govern, not board crush.
    allow_pressure_kPa: 25
    sources: [PaceSetter CRB spec sheet, WRAP 2009 RSC003-010, Lewicki 2007, EPJ Conf 2025 340 10008, Park 2019]
  cereal_carton_dense:
    # Same carton; dense cluster cereal (Grape-Nuts). No crush data for dense
    # cereals; the review assumes at least 100 kPa [E].
    caliper_mm: 0.48
    grammage_gsm: 380
    friction: 0.5
    contact_modulus_MPa: 1.5
    contact_depth_mm: 30
    allow_pressure_kPa: 100
    sources: [PaceSetter CRB spec sheet, WRAP 2009 RSC003-010]

  # ---------------------------------------------------------------- sheets
  # bending_stiffness_Nm: D per unit width, CD. bending_strength_Nm_per_m:
  # crease onset, CD [E]: chipboard midway between elastic limit SCT*t/6 and
  # plastic hinge 0.357*SCT*t; corrugated 0.8 x the midpoint of the M_max range
  # (crease onset 0.6-1.0 x M_max). allow_pressure_kPa: onset of permanent
  # through-thickness damage (corrugated: first yield of the flat-crush curve,
  # before FCT; chipboard: ZD yield).
  chipboard_20pt:
    caliper_mm: 0.51            # [P GSA A-A-1507A]
    grammage_gsm: 352           # [P GSA] (350 [V])
    friction: 0.55              # 0.6-0.8 static / 0.55-0.75 kinetic [E]
    zd_modulus_MPa: 30          # 20-40 [E, paperboard ply models]
    allow_pressure_kPa: 1000    # ZD yield 1000-2000 [E]
    bending_stiffness_Nm: 0.015 # MD/CD 0.034/0.015 [E from Eska Taber]; RDM 0.035/0.017 [V]
    bending_strength_Nm_per_m: 0.6   # MD 0.5-1.1 / CD 0.4-0.8 [E]
    sources: [GSA A-A-1507A, Eska greyboard data sheet, RDM Ovaro 755]
  chipboard_30pt:
    caliper_mm: 0.76
    grammage_gsm: 520           # 495-550 [V/S]
    friction: 0.55
    zd_modulus_MPa: 30
    allow_pressure_kPa: 1000
    bending_stiffness_Nm: 0.045 # MD/CD 0.11/0.045 [V RDM, E Eska]
    bending_strength_Nm_per_m: 1.45  # MD 1.3-2.7 / CD 0.9-2.0 [E]
    sources: [Eska, RDM Ovaro 755, Packwire]
  chipboard_60pt:
    caliper_mm: 1.52
    grammage_gsm: 975           # 945-1006 [V/P]
    friction: 0.55
    zd_modulus_MPa: 30
    allow_pressure_kPa: 1000
    bending_stiffness_Nm: 0.35  # MD/CD 0.79/0.35 [V Eska, ISO 5629]
    bending_strength_Nm_per_m: 5.0   # MD 4.5-9.6 / CD 3.2-6.9 [E]
    sources: [GSA A-A-1507A, Eska board]
  e_flute:
    caliper_mm: 1.6             # 1.5-1.75 [V/P]
    grammage_gsm: 420           # 341-508 [V/P]
    friction: 0.76              # NBR pad on corrugated: 0.82 static / 0.76 kinetic [P Park 2019]
    zd_modulus_MPa: 7.5         # 5-8 [E]; single wall 5.6 MPa [P arXiv 2507.02189]
    allow_pressure_kPa: 320     # first yield 322-338 [P KTU]; FCT 276-414 [V]
    bending_stiffness_Nm: 0.7   # MD/CD 1.61/0.81 [P SCAN-P 65]; 1.87/0.60 [P Garbowski]
    bending_strength_Nm_per_m: 3.0   # M_max CD 3-4.5 [E]
    sources: [SCAN-P 65, Garbowski 2024, Park 2019, KTU J Vibroeng 2012, ABC Box]
  b_flute:
    caliper_mm: 3.0             # 2.8-3.2 [V/P]
    grammage_gsm: 420           # 338-495 [V/P]
    friction: 0.76
    zd_modulus_MPa: 5.0         # 4-6 [E]
    allow_pressure_kPa: 90      # first yield 90-140 [P KTU]; FCT 172-276 [V]
    bending_stiffness_Nm: 3.1   # MD/CD 5.6/3.1 [P TAPPI T 836, 32 ECT B]
    bending_strength_Nm_per_m: 5.6   # M_max CD 5-9 [E]
    sources: [TAPPI T 836, SCAN-P 65, Urbanik 2001, Park 2019, KTU J Vibroeng 2012]
  c_flute:
    caliper_mm: 3.9             # 3.6-4.1 [P]
    grammage_gsm: 520           # 438-594 [S/P]
    friction: 0.76
    zd_modulus_MPa: 4.0         # secant to first yield ~150 kPa at 0.15 mm over 4 mm [E]; 3-6
    allow_pressure_kPa: 105     # first yield 105-141 [P KTU]; FCT 124-207 [V]
    bending_stiffness_Nm: 5.9   # MD/CD 11.3/5.9 (32 ECT) [P TAPPI T 836]
    bending_strength_Nm_per_m: 9.2   # M_max CD 8-15 [E]
    sources: [TAPPI T 836, Urbanik 2001, Chalmers, arXiv 2507.02189, Park 2019, KTU J Vibroeng 2012]
  bc_double_wall:
    caliper_mm: 6.8             # 6.5-7.1 [V/P]
    grammage_gsm: 680           # 558-803 [V/P]
    friction: 0.76
    zd_modulus_MPa: 4.0         # 3-5 [E]
    allow_pressure_kPa: 100     # first yield ~100-200 [E]; FCT is not defined for double wall (ISO 3035)
    bending_stiffness_Nm: 14.8  # MD/CD 19.9/14.8 [P SCAN-P 65]; 17.8/13.4 [P Garbowski]
    bending_strength_Nm_per_m: 14.8  # M_max CD 12-25 [E]
    sources: [SCAN-P 65, Garbowski 2024, Endupack BC sheet, Park 2019]

# Settled fill is 70-90 % of the box height (UK ACFM agreement >= 70 % [P WRAP];
# 21 CFR 100.100 allows functional slack-fill [P]); 0.8 is used. Above the fill
# line the panel is backed by air and the crimped liner, so a pad there may
# push at most unsupported_panel_force_N before the panel dents: yield-line
# estimate 2-4 pi x M_p = 6-12 N for 18 pt CRB under a small pad, first
# permanent strain from about 3 N; larger pads and loading near the glued top
# closure raise it [E]. 10 N is used. Cereal settles at the bottom: the
# contents fill the bottom fill_fraction of the height (unless a box gives its
# fill height or bulk density) and the centre of mass sits below mid-height.
box_defaults:
  grasp_axis: depth             # depth | width: the box dimension the jaw closes across
  fill_fraction: 0.8
  unsupported_panel_force_N: 10

# W = front-panel width (out of plane), D = depth across the jaw, H = height.
# Packaging mass: carton + liner, central estimate bracketed by a surface
# method and a case-weight method [E].
boxes:
  - id: mini_1oz
    label: "Single-serve mini (1.1 oz)"
    material: cereal_carton_flakes
    width_mm: 87
    depth_mm: 36
    height_mm: 126
    net_mass_g: 31              # variety-pack average 1.09 oz, range 0.81-1.5 oz [R]
    packaging_mass_g: 15        # 13-17 [E]
    sources: [Amazon B07GBQKFTB tray (dimensions derived from a 10-box tray), Kroger 30-ct, Webstaurant 0.81 oz]
  - id: cheerios_8p9oz
    label: "Cheerios 8.9 oz"
    material: cereal_carton_flakes
    width_mm: 194.3
    depth_mm: 50.8
    height_mm: 285.8
    net_mass_g: 252.3
    packaging_mass_g: 65        # 60-75 [E]
    sources: [Rite Aid listing, Amazon B019Z95UCO]
