[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graspsim2d"
version = "0.1.0"
description = "2D design search for a 1-DoF two-finger gripper grasping cereal boxes and cardboard sheets"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "shapely>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
graspsim2d = "graspsim2d.cli:main"

[tool.setuptools]
packages = ["graspsim2d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
